    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nt: {
                yellow: '#FFD700',
                gray: '#F3F4F6',
                dark: '#0F172A', // Darker slate for engineering look
                panel: '#FFFFFF',
                border: '#E2E8F0'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            boxShadow: {
              'tech': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
              'tech-lg': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
            },
            animation: {
              'slide-in-right': 'slideInRight 0.3s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
              'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
            },
            keyframes: {
              slideInRight: {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              fadeInUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Engineering Background Grid */
      .bg-grid-slate {
        background-size: 40px 40px;

                          linear-gradient(to bottom, rgba(226, 232, 240, 0.5) 1px, transparent 1px);
      }
      
      /* Refined Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      
      /* Marker Animation */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      .marker-float {
        animation: float 3s ease-in-out infinite;
      }
      
      .leaflet-custom-div-icon {
        background: transparent;
        border: none;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
