# ============================================================================
# RAILWAY DEPLOYMENT CONFIGURATION
# ============================================================================
# Service Architecture:
#   1. Backend (Node.js/Express) - API server
#   2. Frontend (React/Vite) - Static web app
#   3. MLOps (Python/FastAPI) - ML operations
#   4. Simulator (Python/FastAPI) - Sensor Simulator
#   5. Line Bot (Node.js/Express) - Line Messaging API Integration
#   6. PostgreSQL 16 + TimescaleDB (Railway-managed via Dashboard)
#   7. Redis 7 (Railway-managed via Dashboard)
#
# Internal Networking:
#   Services communicate via Railway's .railway.internal domains
#   Example: http://mlops.railway.internal:8001
#
# Documentation: https://docs.railway.app/deploy/config-as-code
# ============================================================================

# ============================================================================
# BACKEND SERVICE (Node.js/Express)
# ============================================================================

[[services]]
name = "backend"

[services.build]
builder = "NIXPACKS"
nixpacksConfigPath = "services/backend/nixpacks.toml"
watchPatterns = ["services/backend/**"]

[services.deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment Variables (set via Railway Dashboard):
# -------------------------------------------------------
# Database (Auto-provided by PostgreSQL plugin):
#   DATABASE_URL = ${{Postgres.DATABASE_URL}}
#   DB_HOST = ${{Postgres.PGHOST}}
#   DB_PORT = ${{Postgres.PGPORT}}
#   DB_NAME = ${{Postgres.PGDATABASE}}
#   DB_USER = ${{Postgres.PGUSER}}
#   DB_PASSWORD = ${{Postgres.PGPASSWORD}}
#   DB_SSL = true
#
# Redis (Auto-provided by Redis plugin):
#   REDIS_URL = ${{Redis.REDIS_URL}}
#
# Application:
#   NODE_ENV = production
#   PORT = 3000
#
# Authentication:
#   JWT_SECRET = <generate-with-openssl-rand-base64-32>
#   JWT_EXPIRY = 24h
#
# Jobs:
#   PREDICTION_JOB_INTERVAL_MINUTES = 60
#   ESCALATION_JOB_INTERVAL_MINUTES = 5
#
# Email:
#   SENDGRID_API_KEY = <your-sendgrid-api-key>
#   EMAIL_FROM = alerts@yourdomain.com
#   EMAIL_FROM_NAME = Battery Management System
#   DASHBOARD_BASE_URL = https://${{RAILWAY_PUBLIC_DOMAIN}}
#
# Service URLs (Internal networking):
#   MLOPS_SERVICE_URL = http://mlops.railway.internal:8001
#
# Logging:
#   LOG_LEVEL = info
#
# Monitoring (Optional):
#   METRICS_AUTH_TOKEN = <random-token>
#   MONITORING_AUTH_TOKEN = <random-token>
#   SENTRY_DSN = <your-sentry-dsn>

# ============================================================================
# FRONTEND SERVICE (React/Vite)
# ============================================================================

[[services]]
name = "frontend"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "services/frontend/Dockerfile"
watchPatterns = ["services/frontend/**"]

[services.deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment Variables (build-time injection):
# -----------------------------------------------
# API Endpoints:
#   VITE_API_BASE_URL = https://${{RAILWAY_PUBLIC_DOMAIN}}/api
#   VITE_MLOPS_SERVICE_URL = https://${{RAILWAY_PUBLIC_DOMAIN}}/mlops
#
# Application:
#   VITE_APP_NAME = Battery Management System
#   VITE_APP_VERSION = 1.0.0
#   VITE_ENVIRONMENT = production
#
# Feature Flags:
#   VITE_ENABLE_ANALYTICS = true
#   VITE_ENABLE_OFFLINE_MODE = false
#   VITE_ENABLE_DEBUG_MODE = false
#
# UI Settings:
#   VITE_DEFAULT_THEME = light
#   VITE_ENABLE_DARK_MODE = true
#
# Build:
#   NODE_ENV = production
#   GENERATE_SOURCEMAP = false
#
# Error Tracking (Optional):
#   VITE_SENTRY_DSN = <your-frontend-sentry-dsn>

# ============================================================================
# MLOPS SERVICE (Python/FastAPI)
# ============================================================================

[[services]]
name = "mlops"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "services/mlops/Dockerfile"
watchPatterns = ["services/mlops/**"]

[services.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment Variables:
# ----------------------
# Application:
#   APP_NAME = MLOps Service
#   ENVIRONMENT = production
#   PORT = 8001
#
# CORS:
#   CORS_ORIGINS = ["https://${{RAILWAY_PUBLIC_DOMAIN}}"]
#
# Models:
#   MODELS_DIR = /app/models
#   MODEL_VERSION = v1.0.0
#
# Redis (Optional - for caching):
#   REDIS_URL = ${{Redis.REDIS_URL}}
#
# Database (Optional - for metrics):
#   DATABASE_URL = ${{Postgres.DATABASE_URL}}
#
# Logging:
#   LOG_LEVEL = INFO
#
# Performance:
#   WORKER_PROCESSES = 2
#   MAX_BATCH_SIZE = 100

# ============================================================================
# SIMULATOR SERVICE (Python/FastAPI)
# ============================================================================

[[services]]
name = "simulator"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "services/simulator/Dockerfile"
watchPatterns = ["services/simulator/**"]

[services.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment Variables:
# ----------------------
# Application:
#   APP_NAME = Sensor Simulator
#   PORT = 8002
#   SIMULATION_INTERVAL = 5
#   KAFKA_BROKER_URL = ${{Kafka.BROKER_URL}} # If using Kafka

# ============================================================================
# LINE BOT SERVICE (Node.js/Express)
# ============================================================================

[[services]]
name = "line-bot"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "services/line-bot/Dockerfile"
watchPatterns = ["services/line-bot/**"]

[services.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment Variables:
# ----------------------
# Application:
#   PORT = 3001
#   NODE_ENV = production
#
# Line API:
#   LINE_CHANNEL_ACCESS_TOKEN = <your-token>
#   LINE_CHANNEL_SECRET = <your-secret>
#
# Integration:
#   BACKEND_API_URL = http://backend.railway.internal:3000
