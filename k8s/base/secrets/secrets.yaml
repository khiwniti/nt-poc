apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: facility-manager
type: Opaque
stringData:
  username: "postgres"
  password: "postgres"
  connection-string: "postgresql://postgres:postgres@postgres:5432/battery_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-key
  namespace: facility-manager
type: Opaque
stringData:
  api-key: "YOUR_GEMINI_API_KEY_HERE"
---
apiVersion: v1
kind: Secret
metadata:
  name: line-credentials
  namespace: facility-manager
type: Opaque
stringData:
  channel-access-token: "YOUR_LINE_TOKEN_HERE"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: facility-manager
type: Opaque
stringData:
  secret: "your-jwt-secret-key-change-in-production"
