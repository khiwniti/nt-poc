name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Test scenario to run'
        required: true
        default: 'light'
        type: choice
        options:
          - light
          - medium
          - heavy
          - stress
          - spike
          - realtime
          - all
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'services/backend/**'
      - 'tests/performance/**'

env:
  NODE_VERSION: '20'

jobs:
  performance-test:
    name: k6 Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'services/backend/package-lock.json'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v4
        with:
          username: postgres
          password: postgres
          database: battery_management_test
          port: 5432
        id: postgres

      - name: Install backend dependencies
        working-directory: services/backend
        run: npm ci

      - name: Run database migrations
        working-directory: services/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: battery_management_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL: false
        run: npm run migrate

      - name: Seed test data
        working-directory: services/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: battery_management_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL: false
        run: npm run test:seed:minimal

      - name: Start backend server
        working-directory: services/backend
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: battery_management_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL: false
        run: |
          npm start &
          echo $! > backend.pid
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -f http://localhost:3000/api/v1/health; do sleep 1; done'

      - name: Run performance tests
        working-directory: tests/performance
        env:
          BASE_URL: http://localhost:3000
          SCENARIO: ${{ github.event.inputs.scenario || 'light' }}
        run: |
          if [ "$SCENARIO" = "all" ]; then
            npm run test:all
          elif [ "$SCENARIO" = "stress" ]; then
            npm run test:stress
          elif [ "$SCENARIO" = "spike" ]; then
            npm run test:spike
          elif [ "$SCENARIO" = "realtime" ]; then
            npm run test:realtime
          else
            npm run test:load:$SCENARIO
          fi

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.event.inputs.scenario || 'light' }}
          path: tests/performance/results/*.json
          retention-days: 30

      - name: Stop backend server
        if: always()
        working-directory: services/backend
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const resultsDir = 'tests/performance/results';
            const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.json'));
            
            if (files.length === 0) {
              console.log('No results found');
              return;
            }
            
            const latestFile = files.sort().reverse()[0];
            const results = JSON.parse(fs.readFileSync(path.join(resultsDir, latestFile), 'utf8'));
            
            const p95 = results.metrics?.http_req_duration_p95 || 'N/A';
            const p99 = results.metrics?.http_req_duration_p99 || 'N/A';
            const errorRate = results.metrics?.http_req_failed_rate || 0;
            const passed = results.thresholds_passed ? '✅' : '❌';
            
            const comment = `## Performance Test Results ${passed}
            
            **Scenario:** ${results.scenario || 'N/A'}
            
            ### Metrics
            - **p95 Response Time:** ${p95}ms (threshold: <200ms)
            - **p99 Response Time:** ${p99}ms (threshold: <500ms)
            - **Error Rate:** ${(errorRate * 100).toFixed(2)}% (threshold: <1%)
            
            ### Status
            - Thresholds: ${results.thresholds_passed ? 'PASSED ✅' : 'FAILED ❌'}
            
            <details>
            <summary>Full Results</summary>
            
            \`\`\`json
            ${JSON.stringify(results, null, 2)}
            \`\`\`
            </details>
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  regression-check:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: performance-test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: performance-results-${{ github.event.inputs.scenario || 'light' }}
          path: current-results

      - name: Check for regressions
        run: |
          echo "Performance regression check"
          echo "Compare current results with baseline"
          # TODO: Implement regression detection logic
          # Compare p95, p99, error rates with baseline
          # Fail if degradation > 10%
