name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rollback'
        required: true
        type: choice
        options:
          - all
          - backend
          - frontend
      tag:
        description: 'Deployment tag to rollback to (optional, uses previous if not specified)'
        required: false
        type: string

env:
  NODE_VERSION: '20'

jobs:
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Get previous deployment
        id: get-previous
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            PREVIOUS_TAG=$(git tag --sort=-v:refname | grep "deploy-" | head -2 | tail -1)
            echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Rollback backend service
        if: inputs.service == 'backend' || inputs.service == 'all'
        run: |
          echo "🔄 Rolling back backend service..."
          railway rollback --service backend -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Rollback database migrations
        if: inputs.service == 'backend' || inputs.service == 'all'
        working-directory: services/backend
        run: |
          echo "🔄 Rolling back database migrations..."
          railway run -s backend npm run migrate:rollback
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Rollback frontend service
        if: inputs.service == 'frontend' || inputs.service == 'all'
        run: |
          echo "🔄 Rolling back frontend service..."
          railway rollback --service frontend -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for services to stabilize
        run: |
          echo "⏳ Waiting for services to stabilize..."
          sleep 30

      - name: Verify backend health
        if: inputs.service == 'backend' || inputs.service == 'all'
        run: |
          for i in {1..10}; do
            if curl -f -s -o /dev/null https://nt-poc-backend-production.up.railway.app/api/v1/health; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Backend health check failed"
          exit 1

      - name: Create rollback tag
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "rollback-$VERSION" -m "Rollback to ${{ steps.get-previous.outputs.tag }}"
          git push origin "rollback-$VERSION"

      - name: Summary
        run: |
          echo "### Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Tag**: ${{ steps.get-previous.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Rollback completed successfully" >> $GITHUB_STEP_SUMMARY
