name: Continuous Deployment to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            services/backend/package-lock.json
            services/frontend/package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install backend dependencies
        working-directory: services/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Run backend tests
        working-directory: services/backend
        run: npm test
        env:
          NODE_ENV: test

      - name: Run frontend tests
        working-directory: services/frontend
        run: npm test
        env:
          NODE_ENV: test

      - name: Build frontend
        working-directory: services/frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy backend to Railway
        id: deploy
        working-directory: services/backend
        run: |
          echo "🚀 Deploying backend to Railway..."
          railway up --service backend --detach
          echo "url=https://nt-poc-backend-production.up.railway.app" >> $GITHUB_OUTPUT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Run database migrations
        working-directory: services/backend
        run: |
          echo "🔄 Running database migrations..."
          railway run -s backend npm run migrate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy frontend to Railway
        working-directory: services/frontend
        run: |
          echo "🚀 Deploying frontend to Railway..."
          railway up --service frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment health check
        run: |
          echo "⏳ Waiting for deployment to be healthy..."
          sleep 30
          for i in {1..10}; do
            if curl -f -s -o /dev/null https://nt-poc-backend-production.up.railway.app/api/v1/health; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1

      - name: Create deployment tag
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "deploy-$VERSION" -m "Deployment $VERSION"
          git push origin "deploy-$VERSION"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs for details."
          echo "Consider running rollback workflow."

  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    needs: deploy
    if: failure() && github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Rollback to previous deployment
        run: |
          echo "🔄 Rolling back to previous deployment..."
          railway rollback --service backend -y
          railway rollback --service frontend -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify rollback
        run: |
          echo "✅ Rollback completed"
          echo "Please verify services are operational"
