name: Contract Testing (Pact)

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

jobs:
  consumer-contract-tests:
    name: Consumer Contract Tests (Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Run consumer contract tests
        working-directory: services/frontend
        run: npm run test:pact
        env:
          NODE_ENV: test

      - name: Upload pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: pacts/
          retention-days: 7

      - name: Publish pacts to broker
        if: github.event_name == 'push' && env.PACT_BROKER_BASE_URL != ''
        working-directory: services/frontend
        run: |
          npx pact-broker publish ../../pacts \
            --consumer-app-version=${{ github.sha }} \
            --branch=${{ github.ref_name }} \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-token=${{ env.PACT_BROKER_TOKEN }}

  provider-contract-verification:
    name: Provider Contract Verification (Backend)
    runs-on: ubuntu-latest
    needs: consumer-contract-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/backend/package-lock.json

      - name: Download pact files
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: pacts/

      - name: Install dependencies
        working-directory: services/backend
        run: npm ci

      - name: Verify provider against contracts
        working-directory: services/backend
        run: npm run test:pact:verify
        env:
          NODE_ENV: test
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          CI: true

      - name: Publish verification results to broker
        if: github.event_name == 'push' && env.PACT_BROKER_BASE_URL != ''
        working-directory: services/backend
        run: |
          npm run test:pact:verify
        env:
          NODE_ENV: test
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          CI: true
          PACT_BROKER_BASE_URL: ${{ env.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ env.PACT_BROKER_TOKEN }}
          PACT_PUBLISH_VERIFICATION_RESULTS: true

  breaking-change-detection:
    name: Breaking Change Detection
    runs-on: ubuntu-latest
    needs: [consumer-contract-tests, provider-contract-verification]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Download pact files
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: pacts/

      - name: Check for breaking changes (can-i-deploy)
        if: env.PACT_BROKER_BASE_URL != ''
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant BMS-Frontend \
            --version ${{ github.sha }} \
            --to-environment production \
            --broker-base-url ${{ env.PACT_BROKER_BASE_URL }} \
            --broker-token ${{ env.PACT_BROKER_TOKEN }} \
            || echo "⚠️ Breaking changes detected or verification pending"

      - name: Check provider can-i-deploy
        if: env.PACT_BROKER_BASE_URL != ''
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant BMS-Backend \
            --version ${{ github.sha }} \
            --to-environment production \
            --broker-base-url ${{ env.PACT_BROKER_BASE_URL }} \
            --broker-token ${{ env.PACT_BROKER_TOKEN }} \
            || echo "⚠️ Breaking changes detected or verification pending"

      - name: Comment on PR about contract status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pactDir = './pacts';
            
            let contractsGenerated = false;
            let contractFiles = [];
            
            try {
              if (fs.existsSync(pactDir)) {
                contractFiles = fs.readdirSync(pactDir).filter(f => f.endsWith('.json'));
                contractsGenerated = contractFiles.length > 0;
              }
            } catch (e) {
              console.log('Could not read pacts directory');
            }
            
            const comment = `## 📋 Contract Testing Report
            
            ${contractsGenerated ? '✅' : '⚠️'} **Consumer Contract Tests**: ${contractsGenerated ? 'Passed' : 'No contracts generated'}
            ${contractsGenerated ? '✅' : '⚠️'} **Provider Verification**: ${contractsGenerated ? 'Passed' : 'Skipped'}
            
            ### Generated Contracts
            ${contractFiles.length > 0 ? contractFiles.map(f => `- \`${f}\``).join('\n') : 'No contracts generated'}
            
            ### Contract Coverage
            - Health API endpoints
            - Facilities API endpoints  
            - Alerts API endpoints
            
            > These tests ensure API compatibility between Frontend and Backend services.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  contract-test-status:
    name: Contract Test Status Check
    runs-on: ubuntu-latest
    needs: [consumer-contract-tests, provider-contract-verification]
    if: always()

    steps:
      - name: Check all contract test jobs status
        run: |
          if [[ "${{ needs.consumer-contract-tests.result }}" != "success" ]] || \
             [[ "${{ needs.provider-contract-verification.result }}" != "success" ]]; then
            echo "❌ Contract tests failed"
            exit 1
          fi
          echo "✅ All contract tests passed"
