# ============================================================================
# RAILWAY FRONTEND SERVICE CONFIGURATION
# ============================================================================
# This configuration is for the React/Vite frontend service deployment
# ============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Pass environment variables as build arguments
buildArgs = [
  "VITE_API_BASE_URL=$VITE_API_BASE_URL",
  "VITE_API_URL=$VITE_API_URL",
  "VITE_GEMINI_API_KEY=$VITE_GEMINI_API_KEY"
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment Variables (build-time injection):
# -----------------------------------------------
# These should be set in Railway Dashboard > Variables
#
# API Endpoints:
#   VITE_API_BASE_URL = https://backend-production-xxxx.up.railway.app/api
#   VITE_MLOPS_SERVICE_URL = https://mlops-production-xxxx.up.railway.app
#
# Application:
#   VITE_APP_NAME = Battery Management System
#   VITE_APP_VERSION = 1.0.0
#   VITE_ENVIRONMENT = production
#
# Feature Flags:
#   VITE_ENABLE_ANALYTICS = true
#   VITE_ENABLE_OFFLINE_MODE = false
#   VITE_ENABLE_DEBUG_MODE = false
#
# UI Settings:
#   VITE_DEFAULT_THEME = light
#   VITE_ENABLE_DARK_MODE = true
#
# Build:
#   NODE_ENV = production
#   GENERATE_SOURCEMAP = false
#
# Error Tracking (Optional):
#   VITE_SENTRY_DSN = <your-frontend-sentry-dsn>