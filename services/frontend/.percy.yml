version: 2
snapshot:
  widths:
    - 375   # Mobile
    - 768   # Tablet
    - 1280  # Desktop
  min-height: 1024
  enable-javascript: true
  discovery:
    allowed-hostnames:
      - localhost
      - 127.0.0.1
    network-idle-timeout: 750

static:
  include: "**/*.html"
  exclude:
    - "dist/**"
    - "coverage/**"
    - "node_modules/**"
