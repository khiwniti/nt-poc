services:
  database:
    image: postgres:16-alpine
    container_name: bms-database-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=battery_management
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bms-network

  redis:
    image: redis:7-alpine
    container_name: bms-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bms-network
    profiles:
      - with-redis

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.dev
    container_name: bms-backend-dev
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=battery_management
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_SSL=false
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-change-in-production
      - MLOPS_SERVICE_URL=http://mlops:8001
      - LOG_LEVEL=debug
    volumes:
      - ./services/backend/src:/app/src
      - ./services/backend/migrations:/app/migrations
      - ./services/backend/seeds:/app/seeds
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bms-network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.dev
    container_name: bms-frontend-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_MLOPS_SERVICE_URL=http://localhost:8001
      - NODE_ENV=development
    volumes:
      - ./services/frontend/src:/app/src
      - ./services/frontend/public:/app/public
      - ./services/frontend/index.html:/app/index.html
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bms-network

  mlops:
    build:
      context: ./services/mlops
      dockerfile: Dockerfile
    container_name: bms-mlops-dev
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - PORT=8001
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - MODELS_DIR=/app/models
      - LOG_LEVEL=INFO
    volumes:
      - ./services/ml/models:/app/models:ro
      - ./services/mlops/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bms-network

  simulator:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    container_name: bms-simulator-dev
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./services/ml/models:/app/models
      - ./services/ml/data:/app/data
      - ./services/ml/src:/app/src
    command: ["python", "train_example.py"]
    networks:
      - bms-network
    profiles:
      - ml-training

networks:
  bms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
