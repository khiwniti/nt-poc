version: "3.8"

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: nt-postgres
    environment:
      POSTGRES_DB: battery_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nt-network

  # Backend Service
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: nt-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/battery_management
      NODE_ENV: production
      PORT: 3000
      DB_SSL: "false"
      SIMULATOR_URL: http://simulator:8001
      PREDICTION_JOB_INTERVAL_MINUTES: 60
      ESCALATION_JOB_INTERVAL_MINUTES: 5
      SENSOR_INGESTION_ENABLED: "true"
      SENSOR_INGESTION_INTERVAL: 10000
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nt-network
    restart: unless-stopped

  # Simulator Service
  simulator:
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    container_name: nt-simulator
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: production
      PORT: 8001
      SIMULATOR_CACHE_SIZE: 500
      BATCH_MAX_SIZE: 200
      BATCH_PARALLEL_WORKERS: 10
      LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - nt-network
    restart: unless-stopped

  # MLOps Service
  mlops:
    build:
      context: ./services/mlops
      dockerfile: Dockerfile
    container_name: nt-mlops
    ports:
      - "8002:8001"
    environment:
      ENVIRONMENT: production
      PORT: 8001
      BATCH_MAX_SIZE: 500
      BATCH_PARALLEL_WORKERS: 10
      MODEL_CACHE_SIZE: 4
      PREDICTION_BATCH_SIZE: 50
      FEATURE_WINDOW_SIZE: 10
      LOG_LEVEL: INFO
    volumes:
      # Mount local models directory (place your model file here)
      - ./services/mlops/models:/app/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nt-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: nt-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nt-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  nt-network:
    driver: bridge
