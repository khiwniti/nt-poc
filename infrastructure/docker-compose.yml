version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/certbot/conf:/etc/letsencrypt:ro
      - ./ssl/certbot/www:/var/www/certbot:ro
      - ../services/frontend/dist:/var/www/battery-management/frontend:ro
    depends_on:
      - backend
      - mlops
    restart: unless-stopped
    networks:
      - bms-network

  certbot:
    image: certbot/certbot:latest
    container_name: bms-certbot
    volumes:
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - bms-network

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    container_name: bms-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - DASHBOARD_BASE_URL=https://yourdomain.com
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - bms-network

  mlops:
    build:
      context: ../services/mlops
      dockerfile: Dockerfile
    container_name: bms-mlops
    environment:
      - ENVIRONMENT=production
      - PORT=8001
      - CORS_ORIGINS=["https://yourdomain.com"]
      - MODELS_DIR=/app/models
      - LOG_LEVEL=INFO
    expose:
      - "8001"
    volumes:
      - ../services/ml/models:/app/models:ro
    restart: unless-stopped
    networks:
      - bms-network

networks:
  bms-network:
    driver: bridge
